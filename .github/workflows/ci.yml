name: CI

on:
  push:
    branches: [ lesson28, main ]
  pull_request:
    branches: [ main, lesson28 ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/codeby-devops

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: hello-world
            dockerfile: lesson28/Dockerfile.hello-world
          - app: hello-jenkins
            dockerfile: lesson28/Dockerfile.hello-jenkins
          - app: hello-devops
            dockerfile: lesson28/Dockerfile.hello-devops

    name: ${{ matrix.app }}

    steps:
      - name: Checkout lesson28 (workflow + Dockerfiles)
        uses: actions/checkout@v5

      - name: Checkout lesson26 (applications)
        uses: actions/checkout@v5
        with:
          ref: lesson26
          path: src

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: src/${{ matrix.app }}/pom.xml

      - name: Build with Maven
        working-directory: src/${{ matrix.app }}
        run: mvn -B -DskipTests clean package

      - name: Run tests
        working-directory: src/${{ matrix.app }}
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-test-reports
          path: src/${{ matrix.app }}/target/surefire-reports/
          retention-days: 7

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-jar
          path: src/${{ matrix.app }}/target/*.jar
          retention-days: 7

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.app }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
